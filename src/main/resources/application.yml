server:
  servlet:
    context-path: ${SERVER_API_PREFIX}

spring:
  application:
    name: skAI-castle-server
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  docker:
    compose:
      lifecycle-management: start-and-stop
  datasource:
    driver-class-name: ${DATASOURCE_DRIVER_CLASS_NAME}
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
  jpa:
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL}
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: ${JPA_HIBERNATE_DDL_AUTO}
    defer-datasource-initialization: true
  sql:
    init:
      mode: ${SQL_INIT_OPT}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

jwt:
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER}
  access-expiration: ${JWT_ACCESS_EXPIRATION} # milliseconds
  refresh-expiration: ${JWT_REFRESH_EXPIRATION} # milliseconds

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

ai-server:
  base-url: ${AI_SERVER_BASE_URL:http://localhost:8000}
