server:
  servlet:
    context-path: ""

spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    defer-datasource-initialization: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never
  mail:
    host: localhost
    port: 25
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
            required: false
  docker:
    compose:
      enabled: false

jwt:
  secret: test-secret-minimum-256-bits-long-key-for-testing-purposes-only-padding
  issuer: test-issuer
  access-expiration: 3600000
  refresh-expiration: 86400000

cors:
  allowed-origins: "http://localhost:3000"

openai:
  api-key: test-key
  chat-model: gpt-4o-mini
  embedding-model: text-embedding-3-small
