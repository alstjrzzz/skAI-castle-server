name: skAI-castle-local

services:
  postgres:
    container_name: skAI-castle-postgres
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: skAI-castle
      POSTGRES_USER: ${DATASOURCE_USERNAME:-skAI-castle}
      POSTGRES_PASSWORD: ${DATASOURCE_PASSWORD:-skAI-castle}
    labels:
      - "org.springframework.boot.ignore=true"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - skAI-castle-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  ai-server:
    build:
      context: ../skai-ai-server
    container_name: skai-ai-server
    labels:
      - "org.springframework.boot.ignore=true"
    ports:
      - "8000:8000"
    env_file:
      - path: ../skai-ai-server/.env
        required: false
    restart: unless-stopped
    networks:
      - skAI-castle-network

  backend:
    build:
      context: .
    container_name: skAI-castle-backend
    depends_on:
      postgres:
        condition: service_healthy
      ai-server:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      - SERVER_API_PREFIX=/api
      - DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - DATASOURCE_URL=jdbc:postgresql://postgres:5432/skAI-castle
      - DATASOURCE_USERNAME=${DATASOURCE_USERNAME:-skAI-castle}
      - DATASOURCE_PASSWORD=${DATASOURCE_PASSWORD:-skAI-castle}
      - JPA_SHOW_SQL=false
      - JPA_HIBERNATE_DDL_AUTO=none
      - SQL_INIT_OPT=always
      - MAIL_HOST=smtp.gmail.com
      - MAIL_PORT=587
      - MAIL_USERNAME=${MAIL_USERNAME:-skAI-castle@gmail.com}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-skAI-castle}
      - JWT_SECRET=${JWT_SECRET:-b6af1aeb8008ac10286dc12d56ba2a38b3f05716702205d064061311f525cd93}
      - JWT_ISSUER=skAI-castle-server
      - JWT_ACCESS_EXPIRATION=3600000
      - JWT_REFRESH_EXPIRATION=604800000
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:8081,http://localhost:8082
      - AI_SERVER_BASE_URL=http://ai-server:8000
      - SPRING_DOCKER_COMPOSE_ENABLED=false
    restart: unless-stopped
    networks:
      - skAI-castle-network

networks:
  skAI-castle-network:
    driver: bridge

volumes:
  postgres-data: