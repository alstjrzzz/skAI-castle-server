name: skAI-castle-local

services:
  postgres:
    container_name: skAI-castle-postgres
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: skAI-castle
      POSTGRES_USER: ${DATASOURCE_USERNAME:-skAI-castle}
      POSTGRES_PASSWORD: ${DATASOURCE_PASSWORD:-skAI-castle}
    labels:
      - "org.springframework.boot.ignore=true"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - skAI-castle-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  ai-server:
    build:
      context: ../skai-ai-server
    container_name: skai-ai-server
    labels:
      - "org.springframework.boot.ignore=true"
    ports:
      - "8000:8000"
    env_file:
      - path: ../skai-ai-server/.env
        required: false
    restart: unless-stopped
    networks:
      - skAI-castle-network


networks:
  skAI-castle-network:
    driver: bridge

volumes:
  postgres-data: